name: Reapptivate
options:
  bundleIdPrefix: com.reapptivate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Reapptivate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Reapptivate
        excludes:
          - "Tests/**"
          - "Resources/**"
      - path: Reapptivate/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedFile
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Kamera wird für das Scannen von QR-Codes benötigt."
        INFOPLIST_KEY_CFBundleDisplayName: "Reapptivate"
        PRODUCT_BUNDLE_IDENTIFIER: com.reapptivate.ios
        PRODUCT_NAME: Reapptivate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Reapptivate/Info.plist
    scheme:
      testTargets: []
      gatherCoverageData: false
